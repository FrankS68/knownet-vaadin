# nginx auf IONOS fuer https://knownet.segieth.cologne (wie games und quiz).
# Einrichten (mit sudo):
#   sudo cp deploy/nginx-knownet.segieth.cologne.conf /etc/nginx/sites-available/knownet.segieth.cologne
#   sudo ln -sf /etc/nginx/sites-available/knownet.segieth.cologne /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream knownet {
    # 127.0.0.1 statt localhost: der Container lauscht nur auf IPv4-Loopback, localhost kann zuerst ::1 liefern
    server 127.0.0.1:8082;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name knownet.segieth.cologne;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name knownet.segieth.cologne;
    # Wildcard-Zertifikat *.segieth.cologne (gemeinsam mit games, quiz)
    ssl_certificate     /etc/nginx/ssl/segieth.cologne/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/segieth.cologne/privkey.pem;

    location / {
        proxy_pass http://knownet;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # die App sieht nur HTTP vom Proxy; Redirects (OAuth-Login) sollen https:// verwenden
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
