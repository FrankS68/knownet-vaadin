services:
  neo4j:
    image: neo4j:5.25-community
    container_name: knownet-neo4j
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1g
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    restart: unless-stopped
    networks:
      - knownet-net
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  knownet:
    image: knownet-vaadin:latest
    container_name: knownet-app
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_NEO4J_URI=bolt://neo4j:7687
      - SPRING_NEO4J_AUTHENTICATION_USERNAME=${NEO4J_USER}
      - SPRING_NEO4J_AUTHENTICATION_PASSWORD=${NEO4J_PASSWORD}
      - WITCHGAMES_GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - WITCHGAMES_GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
    volumes:
      - knownet-data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - knownet-net

volumes:
  neo4j-data:
  neo4j-logs:
  knownet-data:

networks:
  knownet-net:
