services:
  neo4j:
    image: neo4j:5
    container_name: knownet-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/knownet123
    volumes:
      - neo4j-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "knownet123", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  knownet:
    image: knownet-vaadin:latest
    container_name: knownet-app
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_NEO4J_URI=bolt://neo4j:7687
      - SPRING_NEO4J_AUTHENTICATION_USERNAME=neo4j
      - SPRING_NEO4J_AUTHENTICATION_PASSWORD=knownet123
    volumes:
      - ./config:/app/config
      - knownet-data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j-data:
  knownet-data:
