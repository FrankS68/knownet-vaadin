server.port=8082

# Neo4j (Graph-Daten) — Werte werden per Umgebungsvariable oder application-local.properties überschrieben
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=knownet123

# H2 (witch-auth Benutzerdaten, persistent)
spring.datasource.url=jdbc:h2:file:./data/knownet-auth;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Bean-Overriding: KnownetSecurityConfig ueberschreibt OAuthSecurityConfig aus witch-auth
spring.main.allow-bean-definition-overriding=true

# witch-auth: erster Admin — in application-local.properties setzen
witch-auth.first-admin-email=

# OAuth2 Provider — Credentials in application-local.properties setzen
# spring.security.oauth2.client.registration.github.client-id=
# spring.security.oauth2.client.registration.github.client-secret=
# spring.security.oauth2.client.registration.github.scope=read:user,user:email

logging.level.org.springframework.data.neo4j.cypher=ERROR
logging.level.org.springframework.security=INFO
