<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knownet – Anmelden</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #16213e;
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 { color: #e2e8f0; font-size: 2rem; margin-bottom: 8px; }
        p  { color: #94a3b8; margin-bottom: 32px; font-size: 0.95rem; }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 12px;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-google { background: #fff; color: #333; }
        .btn-github { background: #24292e; color: #fff; }
        .btn-gitlab { background: #fc6d26; color: #fff; }
        .btn-microsoft { background: #0078d4; color: #fff; }
        .footer { margin-top: 24px; color: #475569; font-size: 0.8rem; }
        .guest-link { display: block; margin-top: 20px; color: #7B61FF; text-decoration: none; font-size: 0.9rem; }
        .guest-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <h1>🕸 Knownet</h1>
    <p>Melde dich an um Quellen und Aussagen zu erfassen.</p>

    <!-- Nur konfigurierte Provider anzeigen – nicht benötigte auskommentieren -->
    <a class="btn btn-google" href="/oauth2/authorization/google">
        <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Mit Google anmelden
    </a>

    <a class="btn btn-github" href="/oauth2/authorization/github">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
        Mit GitHub anmelden
    </a>

    <!--
    <a class="btn btn-gitlab" href="/oauth2/authorization/gitlab">Mit GitLab anmelden</a>
    <a class="btn btn-microsoft" href="/oauth2/authorization/microsoft">Mit Microsoft anmelden</a>
    -->

    <a class="guest-link" href="/">Ohne Anmeldung lesen →</a>

    <div class="footer">Knownet · Persönliches Wissensnetz</div>
</div>
</body>
</html>
