# Production Configuration
server.port=8082
server.compression.enabled=true
server.compression.min-response-size=1024

# Neo4j — wird per Environment Variablen gesetzt
spring.neo4j.uri=bolt://neo4j:7687
spring.neo4j.authentication.username=${SPRING_NEO4J_AUTHENTICATION_USERNAME:neo4j}
spring.neo4j.authentication.password=${SPRING_NEO4J_AUTHENTICATION_PASSWORD:}

# H2 (witch-auth Benutzerdaten, persistent)
spring.datasource.url=jdbc:h2:file:/app/data/knownet-auth;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Bean-Overriding
spring.main.allow-bean-definition-overriding=true

# witch-auth
witch-auth.first-admin-email=${WITCH_AUTH_FIRST_ADMIN_EMAIL}

# OAuth2 GitHub
spring.security.oauth2.client.registration.github.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# Logging
logging.level.org.springframework.data.neo4j.cypher=ERROR
logging.level.org.springframework.security=WARN
